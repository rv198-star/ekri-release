[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ekri"
version = "1.1.1"
description = "Evidence-bounded Engineering Knowledge Reconstruction and Intelligence"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "../.EKRI/pytest-cache"
